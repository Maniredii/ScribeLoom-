<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScribeLoom</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h1>ScribeLoom</h1>
    </div>
    
    <div class="controls">
        <button id="startBtn" class="btn primary">Start Recording</button>
        <button id="stopBtn" class="btn danger" disabled>Stop Recording</button>
        <button id="clearBtn" class="btn secondary">Clear Session</button>
    </div>

    <div class="status-container">
        Status: <span id="status">Idle</span>
    </div>

    <div class="actions-container">
        <h3>Recorded Steps (<span id="stepCount">0</span>)</h3>
        <ul id="stepsList"></ul>
    </div>

    <div class="export-controls" style="display: flex; flex-direction: column; gap: 8px;">
        <button id="previewBtn" class="btn primary">Preview Workflow</button>
        <div style="display: flex; gap: 8px;">
            <button id="copyMdBtn" class="btn outline" style="flex: 1;">Copy to Clipboard</button>
            <button id="exportMdBtn" class="btn outline" style="flex: 1;">Save .md</button>
        </div>
        <button id="exportJsonBtn" class="btn outline">Save JSON</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
