<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScribeLoom</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h1>ScribeLoom</h1>
    </div>
    
    <div class="controls">
        <button id="startBtn" class="btn primary">Start Recording</button>
        <button id="stopBtn" class="btn danger" disabled>Stop Recording</button>
        <button id="clearBtn" class="btn secondary">Clear Session</button>
    </div>

    <div style="margin: 15px 0; display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #f9fafb; border-radius: 6px; border: 1px solid #e5e7eb;">
        <div style="line-height: 1.2;">
            <strong>🙈 Privacy Masking</strong><br>
            <span style="font-size: 11px; color: #6b7280;">Blurs inputs & images in screenshots</span>
        </div>
        <label class="switch" style="position: relative; display: inline-block; width: 34px; height: 20px;">
            <input type="checkbox" id="privacyToggle" style="opacity: 0; width: 0; height: 0;">
            <span class="slider"></span>
        </label>
    </div>

    <div class="status-container">
        Status: <span id="status">Idle</span>
    </div>

    <div class="actions-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <h3 style="margin: 0;">Recorded Steps (<span id="stepCount">0</span>)</h3>
            <button id="aiMagicBtn" class="btn primary" style="padding: 4px 8px; font-size: 11px;">✨ AI Magic Rewrite</button>
        </div>
        <div id="aiStatus" style="font-size: 11px; color: #4f46e5; margin-bottom: 8px; display: none;"></div>
        <ul id="stepsList"></ul>
    </div>

    <div class="export-controls" style="display: flex; flex-direction: column; gap: 8px;">
        <button id="previewBtn" class="btn primary">Preview Workflow</button>
        <div style="display: flex; gap: 8px;">
            <button id="copyMdBtn" class="btn outline" style="flex: 1;">Copy to Clipboard</button>
            <button id="exportMdBtn" class="btn outline" style="flex: 1;">Save .md</button>
        </div>
        <button id="exportJsonBtn" class="btn outline">Save JSON</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
